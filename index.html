<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12306 余票监测</title>
<style>
  :root {
    --bg: #0f1522;
    --panel: #1a2233;
    --panel-2: #202a40;
    --border: #2c3a55;
    --text: #e8eef7;
    --muted: #8b98b3;
    --accent: #2f7bff;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
    transition: background 0.4s;
  }
  body.alert {
    background: #2a0d0d;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: inset 0 0 0 0 rgba(239,68,68,0); }
    50% { box-shadow: inset 0 0 200px 0 rgba(239,68,68,0.55); }
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
  }
  .panel h2 {
    font-size: 15px;
    margin-bottom: 16px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 1px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
  }
  .field input[type="time"]::-webkit-calendar-picker-indicator {
    filter: invert(0.8);
  }

  .station-picker { position: relative; }
  .station-options {
    display: none;
    position: absolute;
    z-index: 20;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 260px;
    overflow-y: auto;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  }
  .station-options.show { display: block; }
  .station-option {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 14px;
  }
  .station-option:hover, .station-option.active { background: rgba(47,123,255,0.2); }
  .station-option small { color: var(--muted); }
  .station-empty { padding: 10px 12px; color: var(--muted); font-size: 13px; }

  .check-group {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  .check-group label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    cursor: pointer;
    color: var(--text);
  }
  .check-group input[type="checkbox"] {
    width: 17px;
    height: 17px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
  }
  .btn-start { background: var(--green); color: #04120a; }
  .btn-start:hover { filter: brightness(1.1); }
  .btn-stop { background: var(--red); color: #fff; }
  .btn-stop:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* 状态条 */
  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 9px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-size: 14px;
    margin-bottom: 18px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .dot.running { background: var(--green); animation: blink 1.2s infinite; }
  .dot.alert { background: var(--red); animation: blink 0.5s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* 大警报横幅 */
  .big-alert {
    display: none;
    background: var(--red);
    color: #fff;
    padding: 30px 20px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 18px;
    animation: shake 0.4s;
  }
  .big-alert.show { display: block; }
  .big-alert .big {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 8px;
    line-height: 1.2;
  }
  .big-alert .detail { font-size: 18px; margin-top: 10px; letter-spacing: 1px; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* 车次表格 */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td {
    padding: 11px 10px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.train { font-weight: 700; color: var(--accent); }
  .seat-has { color: var(--green); font-weight: 700; }
  .seat-none { color: var(--muted); }
  .seat-houbu { color: var(--amber); }
  tr.available { background: rgba(34,197,94,0.08); }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }

  .btn-ex {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-ex:hover { border-color: var(--red); color: var(--red); }
  .btn-ex.on { border-color: var(--red); color: var(--red); background: rgba(239,68,68,0.12); }
  tr.excluded td { opacity: 0.45; text-decoration: line-through; }
  tr.excluded .btn-ex.on { opacity: 1; }

  .btn-buy {
    background: var(--red);
    color: #fff;
    border: none;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-buy:hover { filter: brightness(1.15); transform: scale(1.05); }
  .btn-buy:disabled { opacity: 0.5; cursor: not-allowed; }

  .excluded-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px dashed var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .excluded-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(239,68,68,0.15);
    color: var(--red);
    padding: 2px 8px 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .excluded-tag button {
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0 2px;
  }

  .log {
    max-height: 160px;
    overflow-y: auto;
    font-family: "Consolas", monospace;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.8;
  }
  .log .ok { color: var(--green); }
  .log .err { color: var(--red); }
  .log .hit { color: var(--amber); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <h1>12306 余票监测</h1>
  <div class="sub">本地代理 · 只提醒不下单 · 请提前挂官方候补</div>

  <!-- 配置面板 -->
  <div class="panel">
    <h2>监测配置</h2>
    <div class="grid">
      <div class="field station-picker">
        <label for="from">出发站</label>
        <input type="text" id="from" placeholder="输入或选择出发站" value="南京南" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="fromOptions">
        <div class="station-options" id="fromOptions" role="listbox"></div>
      </div>
      <div class="field station-picker">
        <label for="to">到达站</label>
        <input type="text" id="to" placeholder="输入或选择到达站" value="徐州东" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="toOptions">
        <div class="station-options" id="toOptions" role="listbox"></div>
      </div>
      <div class="field">
        <label>乘车日期</label>
        <input type="date" id="date">
      </div>
      <div class="field">
        <label>刷新间隔</label>
        <select id="interval">
          <option value="30">30 秒</option>
          <option value="60" selected>60 秒</option>
          <option value="120">2 分钟</option>
          <option value="300">5 分钟</option>
          <option value="custom">自定义（秒）</option>
        </select>
      </div>
      <div class="field" id="customWrap" style="display:none;">
        <label>自定义间隔（秒）</label>
        <input type="number" id="customInterval" min="10" value="45">
      </div>
      <div class="field">
        <label>开始时间</label>
        <input type="time" id="timeFrom" value="18:00">
      </div>
      <div class="field">
        <label>结束时间</label>
        <input type="time" id="timeTo" value="23:00">
      </div>
    </div>

    <div style="margin-top:18px;">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">监测席别（至少选一个）</div>
      <div class="check-group">
        <label><input type="checkbox" class="seat" value="二等座" checked> 二等座</label>
        <label><input type="checkbox" class="seat" value="一等座" checked> 一等座</label>
        <label><input type="checkbox" class="seat" value="商务座"> 商务座</label>
        <label><input type="checkbox" class="seat" value="无座"> 无座</label>
        <label><input type="checkbox" class="seat" value="软卧"> 软卧</label>
        <label><input type="checkbox" class="seat" value="硬卧"> 硬卧</label>
        <label><input type="checkbox" class="seat" value="硬座"> 硬座</label>
      </div>
    </div>

    <div style="margin-top:14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:var(--text);">
        <input type="checkbox" id="autoJump" style="width:16px;height:16px;accent-color:var(--amber);cursor:pointer;">
        <span style="color:var(--amber);font-weight:700;">⚡ 发现余票自动跳转购票页</span>
      </label>
      <span style="font-size:12px;color:var(--muted);">
        勾选后，一旦监测到符合条件的车次有票，立即在新标签打开 12306 预订页（已按车次+席别筛选）
      </span>
    </div>

    <div class="btn-row">
      <button class="btn btn-start" id="btnStart">开始监测</button>
      <button class="btn btn-stop" id="btnStop" disabled>停止监测</button>
    </div>
  </div>

  <!-- 状态条 -->
  <div class="status" id="statusBar">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">待命</span>
  </div>

  <!-- 大警报 -->
  <div class="big-alert" id="bigAlert">
    <div class="big">有 票 了！</div>
    <div class="detail" id="alertDetail"></div>
    <div id="alertButtons" style="margin-top:18px;"></div>
  </div>

  <!-- 车次列表 -->
  <div class="panel">
    <h2>实时余票 <span id="updateTime" style="font-weight:400;"></span></h2>
    <div id="tableWrap">
      <div class="empty">配置好参数后点击「开始监测」</div>
    </div>
    <div class="excluded-bar" id="excludedBar" style="display:none;">
      <span>已排除车次：</span>
      <span id="excludedList"></span>
      <button class="btn-ex" id="btnClearEx" style="margin-left:auto;">清空排除</button>
    </div>
  </div>

  <!-- 日志 -->
  <div class="panel">
    <h2>运行日志</h2>
    <div class="log" id="log"></div>
  </div>
</div>

  function getPinyin(name) {
    var py = "";
    for (var i = 0; i < name.length; i++) {
      py += (PY_MAP[name[i]] || name[i]);
    }
    return py;
  }

  function matchStation(query, station) {
    if (!query) return true;
    var q = query.toLowerCase().trim();
    var name = station.name;
    // 精确匹配站名
    if (name === q) return true;
    // 站名包含
    if (name.indexOf(q) >= 0) return true;
    // 拼音匹配
    var py = getPinyin(name);
    if (py.indexOf(q) >= 0) return true;
    // 拼音首字母匹配
    var initials = "";
    for (var i = 0; i < name.length; i++) {
      initials += (PY_MAP[name[i]] || name[i]).charAt(0);
    }
    if (initials.indexOf(q) >= 0) return true;
    return false;
  }

  function setupStationPicker(inputEl, optionsEl) {
    var activeIdx = -1;
    var currentList = [];
    var isOpen = false;

    function renderList(items) {
      currentList = items;
      activeIdx = -1;
      if (items.length === 0) {
        optionsEl.innerHTML = '<div class="station-empty">无匹配站点</div>';
        return;
      }
      var html = items.slice(0, 50).map(function (s, i) {
        return '<div class="station-option" data-idx="' + i + '" data-name="' + s.name + '">' +
          '<span>' + s.name + '</span><small>' + s.code + '</small></div>';
      }).join("");
      optionsEl.innerHTML = html;
      // 绑定点击
      optionsEl.querySelectorAll(".station-option").forEach(function (el) {
        el.addEventListener("mousedown", function (e) {
          e.preventDefault();
          selectStation(el.getAttribute("data-name"));
        });
      });
    }

    function showDropdown() {
      if (isOpen) return;
      isOpen = true;
      optionsEl.classList.add("show");
      inputEl.setAttribute("aria-expanded", "true");
    }

    function hideDropdown() {
      isOpen = false;
      optionsEl.classList.remove("show");
      inputEl.setAttribute("aria-expanded", "false");
      activeIdx = -1;
    }

    function selectStation(name) {
      inputEl.value = name;
      hideDropdown();
      inputEl.focus();
    }

    function setActive(idx) {
      var items = optionsEl.querySelectorAll(".station-option");
      items.forEach(function (el) { el.classList.remove("active"); });
      if (idx >= 0 && idx < items.length) {
        activeIdx = idx;
        items[idx].classList.add("active");
        items[idx].scrollIntoView({ block: "nearest" });
      }
    }

    function filterAndShow() {
      var q = inputEl.value.trim();
      var results;
      if (!q) {
        // 无输入时显示热门站点
        var hotSet = new Set(HOT_STATIONS);
        results = allStations.filter(function (s) { return hotSet.has(s.name); });
        // 按 HOT_STATIONS 顺序排列
        results.sort(function (a, b) {
          return HOT_STATIONS.indexOf(a.name) - HOT_STATIONS.indexOf(b.name);
        });
      } else {
        results = allStations.filter(function (s) { return matchStation(q, s); });
      }
      renderList(results);
      showDropdown();
    }

    inputEl.addEventListener("focus", filterAndShow);

    inputEl.addEventListener("input", filterAndShow);

    inputEl.addEventListener("blur", function () {
      // 延迟隐藏，让 mousedown 有机会先触发
      setTimeout(hideDropdown, 150);
    });

    inputEl.addEventListener("keydown", function (e) {
      if (!isOpen) return;
      var items = optionsEl.querySelectorAll(".station-option");
      var len = items.length;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        setActive(activeIdx < len - 1 ? activeIdx + 1 : 0);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        setActive(activeIdx > 0 ? activeIdx - 1 : len - 1);
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (activeIdx >= 0 && activeIdx < len) {
          selectStation(items[activeIdx].getAttribute("data-name"));
        } else if (currentList.length > 0) {
          selectStation(currentList[0].name);
        }
      } else if (e.key === "Escape") {
        hideDropdown();
      }
    });
  }

  var EX_KEY = "ticket_monitor_excluded_v1";
  var excluded = loadExcluded();

  function loadExcluded() {
    try {
      var raw = localStorage.getItem(EX_KEY);
      return raw ? new Set(JSON.parse(raw)) : new Set();
    } catch (e) { return new Set(); }
  }
  function saveExcluded() {
    try { localStorage.setItem(EX_KEY, JSON.stringify(Array.from(excluded))); } catch (e) {}
  }
  function isExcluded(trainNo) { return excluded.has(trainNo); }
  function toggleExcluded(trainNo) {
    if (excluded.has(trainNo)) excluded.delete(trainNo);
    else excluded.add(trainNo);
    saveExcluded();
    renderExcludedBar();
  }
  function clearExcluded() {
    excluded.clear();
    saveExcluded();
    renderExcludedBar();
  }
  function renderExcludedBar() {
    var bar = document.getElementById("excludedBar");
    var list = document.getElementById("excludedList");
    if (excluded.size === 0) { bar.style.display = "none"; return; }
    bar.style.display = "flex";
    list.innerHTML = Array.from(excluded).sort().map(function (c) {
      return '<span class="excluded-tag">' + c +
        ' <button title="取消排除">✕</button></span>';
    }).join("");
    list.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () { toggleExcluded(b.parentNode.textContent.replace("✕", "").trim()); });
    });
  }

  function getIntervalSeconds() {
    if (intervalEl.value === "custom") {

      return isNaN(n) ? 45 : Math.max(10, n);

    return parseInt(intervalEl.value, 10);

  function inTimeWindow(t) {
    // 判断车次发车时间是否在监测时间段内
    var parts = (t || "").split(":");
    if (parts.length < 2) return true;
    var hhmm = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    var from = timeFromEl.value.split(":").map(Number);
    var to = timeToEl.value.split(":").map(Number);
    var f = from[0] * 60 + from[1];
    var tt = to[0] * 60 + to[1];
    return hhmm >= f && hhmm <= tt;
  }

  function hasTicket(value) {
    if (value == null) return false;
    var s = String(value).trim();
    if (s === "" || s === "无" || s === "—" || s === "--") return false;
    // "有" 或数字都算有票
    return true;
  }

  function renderTrains(trains, seats) {
    if (!trains || trains.length === 0) {
      tableWrap.innerHTML = '<div class="empty">暂无车次数据</div>';
      updateTime.textContent = "";
      renderExcludedBar();
      return;
    }
    var cols = SEAT_COLS.filter(function (c) { return seats.indexOf(c) >= 0; });
    var html = '<table><thead><tr>';
    html += "<th>车次</th><th>出发</th><th>到达</th><th>历时</th>";
    cols.forEach(function (c) { html += "<th>" + c + "</th>"; });
    html += "<th>操作</th>";
    html += "</tr></thead><tbody>";

    trains.forEach(function (t) {
      var trainNo = t["车次"];
      var ex = isExcluded(trainNo);
      var avail = false;
      var buySeats = [];
      var cells = cols.map(function (c) {
        var v = t[c];
        var cls = "seat-none", txt = v || "无";
        if (hasTicket(v)) { cls = "seat-has"; txt = v === "有" ? "有票" : v; avail = true; buySeats.push(c); }
        else if (t["候补"] === "Y" || t["候补"] === "1") { cls = "seat-houbu"; txt = "候补"; }
        return '<td class="' + cls + '">' + txt + "</td>";
      }).join("");

      html += '<tr class="' + (ex ? "excluded" : (avail ? "available" : "")) + '">';
      html += '<td class="train">' + trainNo + "</td>";
      html += "<td>" + t["发车"] + "</td>";
      html += "<td>" + t["到达"] + "</td>";
      html += "<td>" + t["历时"] + "</td>";
      html += cells;
      html += '<td>' +
        '<button class="btn-ex ' + (ex ? "on" : "") + '" data-train="' + trainNo + '">' +
        (ex ? "取消排除" : "排除") + "</button>" +
        (avail ? ' <button class="btn-buy" data-buy="' + trainNo + '" data-seats="' + buySeats.join(",") + '">去购票</button>' : "") +
        "</td>";
      html += "</tr>";
    });
    html += "</tbody></table>";
    tableWrap.innerHTML = html;
    updateTime.textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });

    tableWrap.querySelectorAll(".btn-ex").forEach(function (b) {
      b.addEventListener("click", function () { toggleExcluded(b.getAttribute("data-train")); });
    });
    tableWrap.querySelectorAll(".btn-buy").forEach(function (b) {
      b.addEventListener("click", function () {
        openBooking(b.getAttribute("data-buy"), b.getAttribute("data-seats").split(","));
      });
    });
    renderExcludedBar();
  }

  function fireAlert(hits) {
    alerted = true;
    hitCount++;
    // 按车次分组，一辆车一行
    var byTrain = {};
    hits.forEach(function (h) {
      if (!byTrain[h["车次"]]) {
        byTrain[h["车次"]] = { 发车: h["发车"], 历时: h["历时"], 席别: [] };
      }
      byTrain[h["车次"]]["席别"].push(h.seatType);
    });
    var lines = Object.keys(byTrain).map(function (c) {
      var t = byTrain[c];
      return c + "　" + t["发车"] + "开　历时" + t["历时"] + "　" + t["席别"].join("、") + "有票";
    }).join("\n");
    alertDetail.textContent = lines;
    alertDetail.style.whiteSpace = "pre-wrap";
    alertDetail.style.textAlign = "left";
    alertDetail.style.fontSize = "22px";
    alertDetail.style.lineHeight = "1.6";
    bigAlert.classList.add("show");
    document.body.classList.add("alert");
    statusDot.className = "dot alert";
    statusText.textContent = "发现余票！共 " + hits.length + " 个席别有票";
    log("★ 有票！\n" + lines, "hit");

    // 每个有票车次生成一个跳转按钮
    var btnWrap = document.getElementById("alertButtons");
    btnWrap.innerHTML = Object.keys(byTrain).map(function (c) {
      var seats = hits.filter(function (h) { return h["车次"] === c; })
        .map(function (h) { return h.seatType; });
      return '<button class="btn-buy" style="font-size:16px;padding:10px 22px;" data-train="' + c + '" data-seats="' + seats.join(",") + '">立即购票 ' + c + '</button>';
    }).join(" ");
    btnWrap.querySelectorAll(".btn-buy").forEach(function (b) {
      b.addEventListener("click", function () {
        openBooking(b.getAttribute("data-train"), b.getAttribute("data-seats").split(","));
      });
    });

    // 响铃（重复多次，确保听到）
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var beep = function () {
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = "square";
        o.frequency.value = 880;
        g.gain.value = 0.4;
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        o.stop(ctx.currentTime + 0.45);
      };
      for (var i = 0; i < 5; i++) setTimeout(beep, i * 500);
    } catch (e) {}

    // 桌面通知
    try {
      if (Notification.permission === "granted") {
        new Notification("12306 有票了！", { body: detail });
      }
    } catch (e) {}
  }

  function openBooking(trainNo, seatTypes) {
    var from = fromEl.value.trim();
    var to = toEl.value.trim();
    var date = dateEl.value;
    if (!from || !to || !date || !trainNo) {
      log("参数不完整，无法跳转", "err");
      return;
    }
    var qs = "?from=" + encodeURIComponent(from) +
      "&to=" + encodeURIComponent(to) +
      "&date=" + encodeURIComponent(date) +
      "&train_no=" + encodeURIComponent(trainNo) +
      "&seat=" + encodeURIComponent(seatTypes.join(","));
    log("正在获取 " + trainNo + " 的购票链接...", "ok");
    fetch("/api/booking-url" + qs)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.ok && d.url) {
          log("已打开购票页：" + trainNo + "（" + seatTypes.join("/") + "）", "hit");
          window.open(d.url, "_blank");
        } else {
          log("购票链接生成失败：" + (d.url || "站点代号缺失"), "err");
        }
      })
      .catch(function (e) { log("跳转失败：" + e, "err"); });
  }

  function maybeAutoJump(hits) {
    if (!autoJump || !autoJump.checked) return;
    var seen = {};
    hits.forEach(function (h) { seen[h["车次"]] = true; });
    Object.keys(seen).forEach(function (c) {
      if (jumpedTrains.has(c)) return;
      jumpedTrains.add(c);
      var seats = hits.filter(function (h) { return h["车次"] === c; })
        .map(function (h) { return h.seatType; });
      openBooking(c, seats);
    });
  }

  function queryOnce() {
    if (!running) return;
    var from = fromEl.value.trim();
    var to = toEl.value.trim();
    var date = dateEl.value;
    var seats = selectedSeats();

    if (!from || !to || !date) {
      log("请填写完整的出发站/到达站/日期", "err");
      return;
    }
    if (seats.length === 0) {
      log("请至少选择一个监测席别", "err");
      return;
    }

    var url = "/api/query?from=" + encodeURIComponent(from) +
      "&to=" + encodeURIComponent(to) +
      "&date=" + encodeURIComponent(date);

    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!running) return;
        if (!data.ok) {
          statusText.textContent = "查询失败：" + data.error;
          statusDot.className = "dot";
          log("查询失败：" + data.error, "err");
          renderTrains([], seats);
          return;
        }

        // 按发车时间过滤，只保留时间段内的车次
        var filtered = data.trains.filter(function (t) {
          return inTimeWindow(t["发车"]);
        });

        // 排除已排除的车次（不显示、不参与告警）
        var visible = filtered.filter(function (t) { return !isExcluded(t["车次"]); });

        renderTrains(visible, seats);

        // 判断是否有票（只看未排除的车次）
        var hits = [];
        visible.forEach(function (t) {
          seats.forEach(function (s) {
            if (hasTicket(t[s])) {
              hits.push({ 车次: t["车次"], 发车: t["发车"], 历时: t["历时"], seatType: s });
            }
          });
        });

        if (hits.length > 0) {
          fireAlert(hits);
          maybeAutoJump(hits);
        } else {
          // 本轮无余票：清除上一轮的告警状态，避免"有票了"横幅残留
          clearAlert();
          statusDot.className = "dot running";
          statusText.textContent = "监测中 · 每 " + getIntervalSeconds() + " 秒刷新 · " +
            timeFromEl.value + "-" + timeToEl.value + " 时段内暂无余票（" + filtered.length + " 趟车）";
          log("已刷新，" + data.trains.length + " 个车次，时段内 " + filtered.length + " 趟，暂无余票", "ok");
        }
      })
      .catch(function (e) {
        if (!running) return;
        statusText.textContent = "请求出错：" + e;
        statusDot.className = "dot";
        log("请求出错：" + e, "err");
      });
  }

  function tick() {
    if (!running) return;
    queryOnce();
  }

  function start() {
    if (running) return;
    running = true;
    alerted = false;
    hitCount = 0;
    clearAlert();

    // 请求桌面通知权限
    try {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }
    } catch (e) {}

    btnStart.disabled = true;
    btnStop.disabled = false;
    statusDot.className = "dot running";
    statusText.textContent = "监测中 · 每 " + getIntervalSeconds() + " 秒刷新 · " +
      timeFromEl.value + "-" + timeToEl.value + " 时段";
    log("开始监测：" + fromEl.value + " → " + toEl.value + " · " + dateEl.value +
        " · " + timeFromEl.value + "-" + timeToEl.value + " · 席别[" + selectedSeats().join("/") + "]", "ok");

    tick();
    timer = setInterval(tick, getIntervalSeconds() * 1000);
  }

  function stop() {
    running = false;
    if (timer) { clearInterval(timer); timer = null; }
    btnStart.disabled = false;
    btnStop.disabled = true;
    statusDot.className = "dot";
    statusText.textContent = "已停止";
    clearAlert();
    log("监测已停止", "ok");
  }

  btnStart.addEventListener("click", start);
  btnStop.addEventListener("click", stop);
  var btnClearEx = document.getElementById("btnClearEx");
  if (btnClearEx) btnClearEx.addEventListener("click", clearExcluded);

  renderExcludedBar();
})();
</script>
</body>
</html>
